name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Mismo contenedor que se usa en local (ver CONTRIBUTING.md): asi lo que pasa en la
      # maquina del que contribuye pasa tambien aca.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -x setup.sh scripts/*.sh scripts/lib/*.sh

  python:
    name: python (tools/encuesta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Solo stdlib: alcanza con verificar que compila y que preguntas.json es coherente
      # (cada pregunta con exactamente una opcion marcada como default del juego).
      - name: py_compile
        run: python3 -m py_compile tools/encuesta/server.py tools/encuesta/tally.py
      - name: preguntas.json
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("tools/encuesta/preguntas.json"))
          ids = [p["id"] for p in d["preguntas"]]
          assert len(ids) == len(set(ids)), "hay ids repetidos"
          secciones = {s["id"] for s in d["secciones"]}
          for p in d["preguntas"]:
              assert p["seccion"] in secciones, p["id"]
              defaults = [o for o in p["opciones"] if o.get("default")]
              assert len(defaults) == 1, f"{p['id']}: {len(defaults)} defaults"
              for o in p["opciones"]:
                  assert isinstance(o["valor"], str), f"{p['id']}: valor no es string"
          print(f"OK: {len(ids)} preguntas, una opcion default cada una")
          EOF

  tofu:
    name: opentofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: fmt
        run: tofu fmt -check -recursive infra/terraform
      - name: init
        run: tofu -chdir=infra/terraform/envs/prod init -backend=false -input=false
      - name: validate
        run: tofu -chdir=infra/terraform/envs/prod validate

  cloud-init:
    name: cloud-init schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      # infra/cloud-init.yaml es un template de templatefile(): hay que renderizarlo antes de
      # validarlo, y hay que probar los DOS modos de clonado del repo.
      - name: render
        run: |
          scripts/render-cloud-init.sh https /tmp/ci-https.yaml
          scripts/render-cloud-init.sh ssh   /tmp/ci-ssh.yaml
      - name: schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init
          cloud-init schema --config-file /tmp/ci-https.yaml
          cloud-init schema --config-file /tmp/ci-ssh.yaml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: un secreto borrado sigue estando en los commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
