name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Mismo contenedor que se usa en local (ver CONTRIBUTING.md): asi lo que pasa en la
      # maquina del que contribuye pasa tambien aca.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -x setup.sh scripts/*.sh scripts/lib/*.sh

  python:
    name: python (tools/encuesta, tools/panel, tools/discord-notifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Solo stdlib: alcanza con verificar que compila y que preguntas.json es coherente
      # (cada pregunta con exactamente una opcion marcada como default del juego).
      - name: py_compile
        run: |
          python3 -m py_compile tools/encuesta/server.py tools/encuesta/tally.py \
            tools/panel/server.py tools/panel/tokens.py \
            tools/discord-notifier/notifier.py
      - name: preguntas.json
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("tools/encuesta/preguntas.json"))
          ids = [p["id"] for p in d["preguntas"]]
          assert len(ids) == len(set(ids)), "hay ids repetidos"
          secciones = {s["id"] for s in d["secciones"]}
          for p in d["preguntas"]:
              assert p["seccion"] in secciones, p["id"]
              defaults = [o for o in p["opciones"] if o.get("default")]
              assert len(defaults) == 1, f"{p['id']}: {len(defaults)} defaults"
              for o in p["opciones"]:
                  assert isinstance(o["valor"], str), f"{p['id']}: valor no es string"
          print(f"OK: {len(ids)} preguntas, una opcion default cada una")
          EOF

      # Los patrones del archivo de usuarios del juego son la unica parte del notifier que
      # depende de como escribe el log Project Zomboid: si cambian, los avisos de entrada y
      # salida dejan de salir sin que nada falle. Se verifican contra lineas reales.
      - name: patrones del archivo de usuarios
        run: |
          python3 - <<'EOF'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location(
              "notifier", "tools/discord-notifier/notifier.py")
          n = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(n)

          s = n.SeguidorDeUsuarios.__new__(n.SeguidorDeUsuarios)
          s.nombres = {}
          casos = [
              ('[04-09-26 03:27:00.540] 76561198000000000 "Fulano" attempting to join.', None),
              ('[04-09-26 03:27:35.424] 76561198000000000 "Fulano" fully connected (10624,9801,0).',
               ("entra", ("76561198000000000", "Fulano"))),
              ('[04-09-26 03:23:41.740] Connection disconnect index=0 guid=1139411779812053871 id=76561198000000000.',
               ("sale", ("76561198000000000", "Fulano"))),
              # Muerte y respawn: la linea existe pero NO es una salida.
              ('[04-09-26 03:15:59.025] 76561198000000000 "Fulano" disconnected player (7919,11484,0).', None),
              ('[04-09-26 03:24:40.059] Connection add index=0 guid=923238236217336958 id=null.', None),
              ('[04-09-26 04:09:38.457] user Fulano died at (10627,10284,0) (non pvp).',
               ("murio", ("Fulano", False))),
              ('[04-09-26 04:09:38.457] user Fulano died at (10627,10284,0) (pvp).',
               ("murio", ("Fulano", True))),
          ]
          for linea, esperado in casos:
              obtenido = s.interpretar(linea)
              assert obtenido == esperado, f"{linea!r}: {obtenido!r} != {esperado!r}"

          perk = '[04-09-26 03:15:41.777] [76561198000000000][Fulano][7919,11484,0][Died][Hours Survived: 3].'
          assert s.interpretar_perk(perk) == ("murio-horas", ("Fulano", 3)), s.interpretar_perk(perk)
          login = '[04-09-26 03:27:32.199] [76561198000000000][Fulano][10776,9764,0][Login][Hours Survived: 0].'
          assert s.interpretar_perk(login) is None

          assert n.RE_ARRANQUE.search("LOG : Network f:0 st:22,940,489> *** SERVER STARTED ****")
          assert n.RE_VERSION.search("st:22,911,512> version=42.20.4 b0bbce05d5 demo=false").group(1) == "42.20.4"
          assert n.RE_RCON_N.search("Players connected (3): ").group(1) == "3"
          print("OK: los patrones del notifier siguen matcheando el log real")
          EOF

  watchdog:
    name: watchdog (patrones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Los archivos de patrones se le pasan a `grep -E -f`: un regex invalido rompe el
      # chequeo del log en la VM y no se nota hasta que el server se cae. Ademas se verifica
      # que el par fatales/ignorar siga haciendo lo que dice: atrapar una caida real y
      # descartar el ruido conocido de los mods.
      - name: patrones validos y con el efecto esperado
        run: |
          set -euo pipefail
          limpiar() { sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$1"; }
          limpiar tools/watchdog/patrones-fatales.txt > /tmp/fatales.re
          limpiar tools/watchdog/patrones-ignorar.txt > /tmp/ignorar.re
          test -s /tmp/fatales.re
          test -s /tmp/ignorar.re
          while IFS= read -r re; do
            echo | grep -E "$re" >/dev/null 2>&1 || [ $? -le 1 ] \
              || { echo "regex invalido: $re"; exit 1; }
          done < /tmp/fatales.re
          while IFS= read -r re; do
            echo | grep -E "$re" >/dev/null 2>&1 || [ $? -le 1 ] \
              || { echo "regex invalido: $re"; exit 1; }
          done < /tmp/ignorar.re

          cat > /tmp/log-falla <<'LOG'
          zomboid-server  | java.lang.OutOfMemoryError: Java heap space
          LOG
          cat > /tmp/log-ruido <<'LOG'
          zomboid-server  | SEVERE: template zombie_torso_01 not found
          zomboid-server  | SEVERE: duplicate texture Base.Hat_Cap
          zomboid-server  | ERROR: IsoPropertyTypeNotFoundException: invalid room metaID 4211
          LOG
          filtrar() { grep -E -f /tmp/fatales.re "$1" | grep -E -v -f /tmp/ignorar.re || true; }
          test -n "$(filtrar /tmp/log-falla)" || { echo "no detecto un OutOfMemoryError"; exit 1; }
          test -z "$(filtrar /tmp/log-ruido)" || { echo "falso positivo con ruido de mods"; exit 1; }
          echo "OK: patrones validos, atrapa la falla y descarta el ruido"

  tofu:
    name: opentofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: fmt
        run: tofu fmt -check -recursive infra/terraform
      - name: init
        run: tofu -chdir=infra/terraform/envs/prod init -backend=false -input=false
      - name: validate
        run: tofu -chdir=infra/terraform/envs/prod validate

  cloud-init:
    name: cloud-init schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      # infra/cloud-init.yaml es un template de templatefile(): hay que renderizarlo antes de
      # validarlo, y hay que probar los DOS modos de clonado del repo.
      - name: render
        run: |
          scripts/render-cloud-init.sh https /tmp/ci-https.yaml
          scripts/render-cloud-init.sh ssh   /tmp/ci-ssh.yaml
      - name: schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init
          cloud-init schema --config-file /tmp/ci-https.yaml
          cloud-init schema --config-file /tmp/ci-ssh.yaml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: un secreto borrado sigue estando en los commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
