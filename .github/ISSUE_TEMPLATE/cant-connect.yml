name: Cannot connect to the server
description: The server exists, but you or your players cannot join
title: "Cannot connect: "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Two checks first; they resolve most cases.

        1. `make doctor` reports what is missing.
        2. `make remote-status` reports whether the game is actually running.

        Do not paste the server password or the contents of `terraform.tfvars`. If you include an
        IP address, mask the last octets, for example `203.0.113.x`.

  - type: dropdown
    id: who
    attributes:
      label: Who is affected?
      options:
        - Only me (the administrator)
        - Only the other players; I can join
        - Everyone
    validations:
      required: true

  - type: dropdown
    id: when
    attributes:
      label: When did it start?
      options:
        - It never worked (first deployment)
        - It worked and then stopped
        - After adding or removing a mod
        - After a `make deploy` or a `make sync`
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: What does the game show, exactly?
      description: Copy the message verbatim, or describe the behaviour (hangs on loading, closes, and so on).
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `make doctor`
      description: Paste it in full. It is formatted automatically.
      render: text
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of `make remote-status`
      render: text

  - type: input
    id: system
    attributes:
      label: Which system do you administer the server from?
      placeholder: Ubuntu 24.04 / macOS 15 / Windows 11 with WSL2

  - type: checkboxes
    id: checked
    attributes:
      label: I have checked that
      options:
        - label: The players are on the stable branch (Build 42), with no Steam beta selected
        - label: They are using UDP port 16261
        - label: They were given the server password, not the admin password
